<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free fence quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #ff6b1a;
      --brand-soft: #fff1e7;
      --ink: #1a1a1a;
      --paper: #fbfaf6;
      --line: #e2e1dc;
      --muted: #64748b;
      --red: #dc2626;
      --green: #16a34a;
      --green-bg: #ecfdf5;
      --green-line: #6ee7b7;
      --font-display: "Saira Condensed", system-ui, sans-serif;
      --font-ui: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.45;
      padding: 12px;
    }
    .card {
      max-width: 380px;
      margin: 0 auto;
      background: #fff;
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: 4px 4px 0 var(--ink);
      overflow: hidden;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1;
      padding: 4px;
    }
    .logo span { color: var(--brand); }
    .title {
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.005em;
    }
    .title em {
      color: var(--brand);
      font-style: normal;
    }
    .sub {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      margin-top: 2px;
    }
    .lang {
      margin-left: auto;
      font-size: 11px;
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--ink);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-weight: 500;
    }
    .divider {
      border: 0;
      border-top: 1.5px solid var(--ink);
      margin: 0 18px;
    }
    .body { padding: 14px 18px 18px; }
    .stack > * + * { margin-top: 10px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="tel"],
    input[type="email"],
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-family: var(--font-ui);
      font-size: 15px;
      color: var(--ink);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 107, 26, 0.15);
    }
    .pool-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink);
      margin-top: 4px;
    }
    .pool-line input { width: auto; }
    .alert {
      background: #fff8d8;
      border: 1.5px solid #b27d00;
      color: #4a3a00;
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
    }
    .submit {
      display: block;
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: 1.5px solid var(--ink);
      padding: 12px 18px;
      border-radius: 6px;
      box-shadow: 3px 3px 0 var(--ink);
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: 16px;
      cursor: pointer;
      margin-top: 14px;
    }
    .submit:hover {
      background: var(--ink);
    }
    .submit:active {
      box-shadow: 1px 1px 0 var(--ink);
      transform: translate(2px, 2px);
    }
    .submit:disabled { opacity: .6; cursor: not-allowed; }
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
    }
    .err {
      background: #fff3ec;
      border: 1.5px solid var(--red);
      color: var(--red);
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }
    .ok {
      display: none;
      background: var(--green-bg);
      border: 1.5px solid var(--green-line);
      color: #065f46;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 13px;
      margin: 14px 18px 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="logo">FQ<span>·</span>P</div>
      <div>
        <div class="title" data-i18n="title">Free fence <em>quote</em></div>
        <div class="sub" data-i18n="sub">Miami-Dade · 1-day reply</div>
      </div>
      <button type="button" class="lang" id="langToggle">Español</button>
    </div>

    <hr class="divider" />

    <div class="body">
      <form id="quoteForm" novalidate>
        <div class="stack">
          <div>
            <label data-i18n="lbl_name">Your name</label>
            <input type="text" name="name" required maxlength="120" />
          </div>

          <div>
            <label data-i18n="lbl_contact">Phone or email</label>
            <input type="text" name="contact" required maxlength="200" placeholder="305-555-0100" />
          </div>

          <div>
            <label data-i18n="lbl_zip">Property ZIP</label>
            <input type="text" name="zip" required pattern="\d{5}" maxlength="5" placeholder="33186" />
          </div>

          <div>
            <label data-i18n="lbl_type">Fence type</label>
            <select name="fenceType" required>
              <option value="" disabled selected data-i18n="opt_pick">Pick one…</option>
              <option value="aluminum" data-i18n="ft_aluminum">Aluminum</option>
              <option value="chain_link" data-i18n="ft_chain_link">Chain link</option>
              <option value="wood_privacy" data-i18n="ft_wood_privacy">Wood privacy</option>
              <option value="wood_picket" data-i18n="ft_wood_picket">Wood picket</option>
              <option value="vinyl" data-i18n="ft_vinyl">Vinyl / PVC</option>
              <option value="wrought_iron" data-i18n="ft_wrought_iron">Wrought iron</option>
              <option value="other" data-i18n="ft_other">Not sure</option>
            </select>
          </div>

          <label class="pool-line">
            <input type="checkbox" name="poolAdjacent" />
            <span data-i18n="lbl_pool">Around or near a pool</span>
          </label>

          <div id="poolNote" class="alert" style="display:none">
            <span data-i18n="warn_pool">Pool barriers in Miami-Dade must be ≥ 4 ft tall with self-closing/self-latching gates. We'll quote it to code.</span>
          </div>
        </div>

        <button type="submit" class="submit" data-i18n="btn">Get my free quote →</button>
        <div id="formErr" class="err"></div>

        <div class="footer">
          <span data-i18n="footer">No spam. We reply within 1 business day.</span>
        </div>
      </form>
    </div>

    <div id="success" class="ok">
      <strong data-i18n="ok_title">Thanks — got it.</strong>
      <div style="margin-top:6px"><span data-i18n="ok_body">A team member will call within one business day.</span> <a id="urgentPhone" style="color:#065f46;font-weight:600;display:none"></a></div>
    </div>
  </div>

<script>
(function () {
  // ====== CONFIG ======
  // Tenant config arrives via query params so ONE widget file serves any
  // contractor (this is a multi-tenant product — no company is hardcoded):
  //   ?company=Your+Fence+Co&phone=305.555.0100&email=leads@yourfence.co&site=yourfence.co
  // ENDPOINT: lead-intake URL accepting multipart/form-data POST. If blank,
  // falls back to mailto: using ?email= (no email either → error message).
  var qs = new URLSearchParams(location.search);
  var ENDPOINT = qs.get("endpoint") || "";
  var COMPANY = qs.get("company") || "";
  var PHONE = qs.get("phone") || "";
  var FALLBACK_EMAIL = qs.get("email") || "";
  var SITE = qs.get("site") || location.hostname || "embed";
  if (COMPANY) document.title = "Free fence quote — " + COMPANY;
  // ====================

  var I18N = {
    en: {
      title: "Free fence <em>quote</em>",
      sub: "Miami-Dade · 1-day reply",
      lbl_name: "Your name",
      lbl_contact: "Phone or email",
      lbl_zip: "Property ZIP",
      lbl_type: "Fence type",
      lbl_pool: "Around or near a pool",
      warn_pool: "Pool barriers in Miami-Dade must be ≥ 4 ft tall with self-closing/self-latching gates. We'll quote it to code.",
      opt_pick: "Pick one…",
      ft_aluminum: "Aluminum",
      ft_chain_link: "Chain link",
      ft_wood_privacy: "Wood privacy",
      ft_wood_picket: "Wood picket",
      ft_vinyl: "Vinyl / PVC",
      ft_wrought_iron: "Wrought iron",
      ft_other: "Not sure",
      btn: "Get my free quote →",
      footer: "No spam. We reply within 1 business day.",
      ok_title: "Thanks — got it.",
      ok_body: PHONE
        ? "A team member will call within one business day. Urgent?"
        : "A team member will reach out within one business day.",
      err_required: "Please fill in the required fields.",
      err_send: PHONE
        ? "Couldn't send. Please call " + PHONE + "."
        : "Couldn't send. Please try again.",
      lang_to: "Español",
    },
    es: {
      title: "<em>Presupuesto</em> gratis",
      sub: "Miami-Dade · respuesta en 1 día",
      lbl_name: "Tu nombre",
      lbl_contact: "Teléfono o correo",
      lbl_zip: "Código postal",
      lbl_type: "Tipo de cerca",
      lbl_pool: "Alrededor o cerca de una piscina",
      warn_pool: "Las cercas de piscina en Miami-Dade deben tener ≥ 4 pies con puertas auto-cerrantes/auto-trabantes. Cotizamos según el código.",
      opt_pick: "Selecciona…",
      ft_aluminum: "Aluminio",
      ft_chain_link: "Malla ciclónica",
      ft_wood_privacy: "Privacidad de madera",
      ft_wood_picket: "Estacas de madera",
      ft_vinyl: "Vinilo / PVC",
      ft_wrought_iron: "Hierro forjado",
      ft_other: "No estoy seguro",
      btn: "Solicitar presupuesto →",
      footer: "Sin spam. Respondemos en 1 día hábil.",
      ok_title: "Gracias — recibido.",
      ok_body: PHONE
        ? "Un miembro del equipo te llamará en un día hábil. ¿Urgente?"
        : "Un miembro del equipo te contactará en un día hábil.",
      err_required: "Por favor completa los campos requeridos.",
      err_send: PHONE
        ? "No se pudo enviar. Llama al " + PHONE + "."
        : "No se pudo enviar. Inténtalo de nuevo.",
      lang_to: "English",
    },
  };

  var lang = "en";

  function applyLang() {
    var d = I18N[lang];
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (d[k] != null) {
        if (el.tagName === "OPTION" || k === "title" || k.indexOf("warn_") === 0) {
          el.innerHTML = d[k];
        } else {
          el.textContent = d[k];
        }
      }
    });
    document.getElementById("langToggle").textContent = d.lang_to;
    document.documentElement.setAttribute("lang", lang);
  }

  document.getElementById("langToggle").addEventListener("click", function () {
    lang = lang === "en" ? "es" : "en";
    applyLang();
  });
  applyLang();

  // Tenant phone in the success box (hidden when no ?phone= was supplied).
  var urgentPhone = document.getElementById("urgentPhone");
  if (PHONE && urgentPhone) {
    urgentPhone.href = "tel:+1" + PHONE.replace(/\D/g, "");
    urgentPhone.textContent = PHONE;
    urgentPhone.style.display = "";
  }

  var poolBox = document.querySelector('input[name="poolAdjacent"]');
  var poolNote = document.getElementById("poolNote");
  poolBox.addEventListener("change", function () {
    poolNote.style.display = poolBox.checked ? "" : "none";
  });

  var form = document.getElementById("quoteForm");
  var errBox = document.getElementById("formErr");
  var successBox = document.getElementById("success");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errBox.style.display = "none";

    if (!form.checkValidity()) {
      errBox.textContent = I18N[lang].err_required;
      errBox.style.display = "";
      form.reportValidity();
      return;
    }

    var fd = new FormData(form);
    fd.append("source", SITE + " embed");
    if (COMPANY) fd.append("company", COMPANY);
    fd.append("submitted_at", new Date().toISOString());
    fd.append("lang", lang);

    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;

    if (ENDPOINT) {
      fetch(ENDPOINT, { method: "POST", body: fd })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          form.style.display = "none";
          successBox.style.display = "";
        })
        .catch(function () {
          errBox.textContent = I18N[lang].err_send;
          errBox.style.display = "";
          btn.disabled = false;
        });
    } else if (FALLBACK_EMAIL) {
      var lines = [];
      fd.forEach(function (v, k) {
        lines.push(k + ": " + v);
      });
      var subject = "Quote request — " + (fd.get("name") || "");
      window.location.href =
        "mailto:" + FALLBACK_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(lines.join("\n"));
      form.style.display = "none";
      successBox.style.display = "";
    } else {
      // No endpoint and no tenant email configured — nowhere to send.
      errBox.textContent = I18N[lang].err_send;
      errBox.style.display = "";
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
